name: Build and Push Custom Frappe v16 Image

on:
  push:
    branches:
      - main  # 当代码推送到 main 分支时触发
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: DockerHub
    env:
      BUILDER_DIR: builder
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/layered/Containerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:version-16
            ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:latest
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
            CACHE_BUST=${{ github.run_id }}
          secret-files: |
            apps_json=apps.json

      - name: Image Summary
        run: |
          echo "Success! Image pushed to Docker Hub."
          echo "Tags: ${{ secrets.DOCKERHUB_USERNAME }}/frappe-custom:version-16"
